<style>
/* Layout: sticky coach header, tab bar on top (bottom on phones), one column of working panels that splits in two on wide screens */
:root {
  --bg: #eef3ef;
  --surface: #ffffff;
  --sunk: #e3ebe5;
  --ink: #15201a;
  --muted: #5a6b61;
  --line: #d3ddd6;
  --accent: #0d7451;
  --accent-ink: #ffffff;
  --accent-soft: #d8ede2;
  --warm: #b86e0c;
  --warm-soft: #f6e8d2;
  --danger: #b3261e;
  --danger-soft: #f8dcd9;
  --scrim: rgb(8 16 12 / .55);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-num: "Spline Sans Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1411; --surface: #151f1a; --sunk: #1b2721; --ink: #e5eee8; --muted: #91a398; --line: #26352d;
    --accent: #47c18b; --accent-ink: #06140d; --accent-soft: #173828; --warm: #e5a548; --warm-soft: #3a2a12;
    --danger: #f2776d; --danger-soft: #3d1a17; --scrim: rgb(0 0 0 / .65); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1411; --surface: #151f1a; --sunk: #1b2721; --ink: #e5eee8; --muted: #91a398; --line: #26352d;
  --accent: #47c18b; --accent-ink: #06140d; --accent-soft: #173828; --warm: #e5a548; --warm-soft: #3a2a12;
  --danger: #f2776d; --danger-soft: #3d1a17; --scrim: rgb(0 0 0 / .65); color-scheme: dark;
}
/* keeps content clear of the iPhone notch and home bar when installed */
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h2 { font-size: 1.45rem; font-weight: 700; }
h3 { font-size: 1.1rem; font-weight: 700; }
p { margin: 0; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.label { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* Header + tabs */
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  margin: 0 auto; max-width: 1040px; padding-block: 14px 0; border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -.01em; }
.brand h1 span { color: var(--accent); }
.daychip { font-family: var(--font-num); font-size: .85rem; color: var(--muted); }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-top: 10px; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button {
  border: 0; background: none; padding: 10px 12px; border-bottom: 3px solid transparent;
  font-weight: 700; color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 6px;
}
nav.tabs svg { width: 20px; height: 20px; flex: none; }
nav.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
@media (max-width: 700px) {
  header.top { padding-bottom: 10px; }
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; margin: 0; z-index: 6; gap: 0; justify-content: space-around;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 4px max(4px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px));
  }
  nav.tabs button { flex: 1 1 0; flex-direction: column; gap: 2px; padding: 6px 0; font-size: .66rem; border-bottom: 0; border-top: 3px solid transparent; min-width: 0; }
  nav.tabs button[aria-selected="true"] { border-top-color: var(--accent); }
  nav.tabs svg { width: 22px; height: 22px; }
  body { padding-bottom: 96px; }
  #toast { bottom: calc(62px + env(safe-area-inset-bottom, 0px)) !important; }
}

main { max-width: 1040px; margin: 0 auto; padding-top: 20px; display: grid; gap: 20px; }
section.view { display: grid; gap: 20px; }
.grid2 { display: grid; gap: 20px; grid-template-columns: 1fr; }
@media (min-width: 820px) { .grid2 { grid-template-columns: 1fr 1fr; align-items: start; } .grid2 > .wide { grid-column: 1 / -1; } }
.grid2 > *, .stack > * { min-width: 0; }
.stack { display: grid; gap: 20px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }

/* Segmented control for sections inside a tab */
.seg { display: flex; gap: 4px; background: var(--sunk); border-radius: 12px; padding: 4px; overflow-x: auto; scrollbar-width: none; }
.seg button { flex: 1 1 auto; min-width: 0; border: 0; background: none; border-radius: 9px; padding: 8px 6px; font-size: .88rem; font-weight: 700; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / .12); }

/* Hero numbers */
.hero { display: grid; gap: 14px; }
.hero-line { font-family: var(--font-display); font-size: clamp(1.45rem, 4vw, 2.2rem); font-weight: 700; line-height: 1.15; max-width: 30ch; }
.hero-line em { font-style: normal; color: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.stat { background: var(--sunk); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; align-content: start; }
.stat b { font-family: var(--font-num); font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat .sub { font-size: .8rem; color: var(--muted); }

/* Notices and chips */
.note { border-radius: 12px; padding: 12px 14px; background: var(--warm-soft); display: grid; gap: 8px; }
.note.ok { background: var(--accent-soft); }
.note.bad { background: var(--danger-soft); }
.note strong { font-family: var(--font-display); }
.chip { display: inline-block; font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.chip.ok { background: var(--accent-soft); color: var(--accent); }
.chip.warn { background: var(--warm-soft); color: var(--warm); }
.chip.bad { background: var(--danger-soft); color: var(--danger); }
.pill { display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); }
.pill.warm { background: var(--warm); color: var(--surface); }

/* Checklist */
.checks { display: grid; gap: 6px; list-style: none; margin: 0; padding: 0; }
.check { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; padding: 10px; border-radius: 10px; cursor: pointer; }
.check:hover { background: var(--sunk); }
.check input { appearance: none; -webkit-appearance: none; width: 24px; height: 24px; border: 2px solid var(--line); border-radius: 7px; margin: 0; display: grid; place-content: center; cursor: pointer; background: var(--surface); }
.check input:checked { background: var(--accent); border-color: var(--accent); }
.check input:checked::after { content: ""; width: 6px; height: 11px; border: solid var(--accent-ink); border-width: 0 3px 3px 0; transform: translateY(-1px) rotate(45deg); }
.check .t { font-weight: 700; }
.check .d { font-size: .85rem; color: var(--muted); }
.check.done .t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--accent); }
.tm { font-family: var(--font-num); font-size: .8rem; font-weight: 600; color: var(--accent); }
.ti.now .check { background: var(--accent-soft); }
.ti.late .tm { color: var(--warm); }
.ti.done .tm { color: var(--muted); }
.remind { border: 2px solid var(--accent); }
.remind h2 { font-size: 1.3rem; }

/* Meter */
.meter { height: 10px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.meter.warm i { background: var(--warm); }
.meter.bad i { background: var(--danger); }

/* Water */
.glasses { display: flex; flex-wrap: wrap; gap: 6px; }
.glass { width: 30px; height: 38px; border: 2px solid var(--line); border-radius: 4px 4px 9px 9px; background: var(--surface); position: relative; overflow: hidden; padding: 0; }
.glass.full { border-color: var(--accent); }
.glass.full::after { content: ""; position: absolute; inset: 30% 0 0; background: var(--accent); opacity: .75; }

/* Scale buttons (mood, energy) */
.scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.scale button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 2px; font-size: .78rem; font-weight: 700; color: var(--muted); }
.scale button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* Inputs */
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: .85rem; font-weight: 700; color: var(--muted); }
.field input, .field select, textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); min-height: 44px;
}
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.row > .field { flex: 1 1 120px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 14px; font-weight: 700; min-height: 44px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.small { padding: 6px 10px; font-size: .85rem; min-height: 34px; }
.btn.wide { width: 100%; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 34px; height: 34px; font-weight: 700; display: inline-grid; place-content: center; padding: 0; }

/* Week strip */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wd { border: 1px solid var(--line); border-radius: 10px; padding: 8px 2px; text-align: center; display: grid; gap: 2px; font-size: .78rem; }
.wd b { font-family: var(--font-display); font-size: .85rem; }
.wd.today { border-color: var(--accent); background: var(--accent-soft); }

/* Exercises + guided workout */
.ex-list { display: grid; gap: 10px; }
.ex { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.ex.complete { border-color: var(--accent); background: var(--accent-soft); }
.ex-top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.ex-top h3 { font-size: 1rem; }
.dose { font-family: var(--font-num); font-size: .85rem; background: var(--sunk); border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
.ex .alt { font-size: .85rem; color: var(--muted); }
a.watch { color: var(--accent); font-weight: 700; font-size: .88rem; text-underline-offset: 3px; justify-self: start; }

/* Meal plan */
.planmeal { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.planmeal ul { margin: 0; padding-left: 1.1em; display: grid; gap: 2px; font-size: .92rem; }

/* Body measurements */
.mgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }

/* Progress photos */
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.compare figure, .thumbs figure { margin: 0; display: grid; gap: 4px; min-width: 0; }
.compare img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 12px; background: var(--sunk); max-width: 100%; }
.compare figcaption, .thumbs figcaption { font-size: .8rem; color: var(--muted); }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.thumbs img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 10px; background: var(--sunk); max-width: 100%; }
.photo-empty { aspect-ratio: 3 / 4; border-radius: 12px; background: var(--sunk); display: grid; place-content: center; text-align: center; padding: 10px; font-size: .85rem; color: var(--muted); }
.sets { display: flex; gap: 8px; flex-wrap: wrap; }
.set { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); font-family: var(--font-num); font-weight: 600; }
.set.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.restbar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); z-index: 4; display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 10px 14px; font-weight: 700; }
.restbar .num { font-size: 1.3rem; }
.restbar button { background: var(--accent-ink); color: var(--accent); border: 0; border-radius: 8px; padding: 6px 10px; font-weight: 700; }
.phases { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.phase { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; }
.phase.on { border-color: var(--accent); background: var(--accent-soft); }

/* Food */
.plate-wrap { display: grid; grid-template-columns: 170px 1fr; gap: 18px; align-items: center; }
@media (max-width: 520px) { .plate-wrap { grid-template-columns: 1fr; justify-items: center; } }
.plate-wrap svg { width: 170px; height: 170px; }
.legend { display: grid; gap: 8px; }
.legend div { display: grid; grid-template-columns: 14px 1fr; gap: 10px; align-items: start; }
.legend i { width: 14px; height: 14px; border-radius: 4px; margin-top: 4px; }
.results { display: grid; gap: 4px; max-height: 320px; overflow-y: auto; }
.result { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; }
.result:hover { border-color: var(--accent); }
.result .k { font-family: var(--font-num); font-size: .8rem; color: var(--muted); white-space: nowrap; }
.entries { list-style: none; margin: 0; padding: 0; display: grid; }
.entry { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
.entry:first-child { border-top: 0; }
.entry .qty { display: flex; gap: 6px; align-items: center; }
.entry .qty .num { min-width: 2.2em; text-align: center; }
.mealhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 6px; }
details.recipe { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
details.recipe summary { cursor: pointer; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-weight: 700; list-style: none; }
details.recipe summary::-webkit-details-marker { display: none; }
details.recipe[open] summary { margin-bottom: 8px; }
details.recipe ol, details.recipe ul { margin: 6px 0 0; padding-left: 1.2em; display: grid; gap: 4px; }

/* Tables */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
td.n { font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Progress */
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--font-num); font-size: 11px; }
.heat { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px; }
.heat i { aspect-ratio: 1; border-radius: 4px; background: var(--sunk); max-width: 100%; }
.heat i[data-l="1"] { background: color-mix(in srgb, var(--accent) 30%, var(--sunk)); }
.heat i[data-l="2"] { background: color-mix(in srgb, var(--accent) 60%, var(--sunk)); }
.heat i[data-l="3"] { background: var(--accent); }
.heat i.today { outline: 2px solid var(--warm); outline-offset: 1px; }
.miles { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.miles li { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; }
.miles .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); }
.miles li.hit .dot { background: var(--accent); border-color: var(--accent); }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.badge { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 6px; justify-items: start; }
.badge .medal { width: 40px; height: 40px; border-radius: 50%; display: grid; place-content: center; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-weight: 800; font-size: 1rem; }
.badge.locked { background: var(--sunk); border-color: transparent; }
.badge.locked .medal { background: var(--line); color: var(--muted); }
.badge b { font-family: var(--font-display); font-size: .95rem; line-height: 1.2; }
.badge span { font-size: .78rem; color: var(--muted); }
.report { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }

/* Coach chat */
.chat { display: grid; gap: 10px; }
.bubble { max-width: 88%; padding: 10px 14px; border-radius: 16px; display: grid; gap: 6px; overflow-wrap: anywhere; }
.bubble p, .bubble ul, .bubble ol { margin: 0; }
.bubble ul, .bubble ol { padding-left: 1.2em; display: grid; gap: 3px; }
.bubble.me { justify-self: end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; white-space: pre-wrap; }
.bubble.bot { justify-self: start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.bubble .saved { font-size: .78rem; color: var(--accent); font-weight: 700; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 8px 12px; font-size: .85rem; font-weight: 700; text-align: left; }
.composer { position: sticky; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); z-index: 3; background: var(--bg); padding-block: 8px; display: flex; gap: 8px; align-items: end; }
@media (min-width: 701px) { .composer { bottom: 0; } }
.composer textarea { flex: 1; min-height: 46px; max-height: 140px; resize: none; }

/* Readings */
.readings { list-style: none; margin: 0; padding: 0; display: grid; }
.readings li { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
.readings li:first-child { border-top: 0; }

/* Overlay: toast and modal */
#toast { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; pointer-events: none;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.toast-card { pointer-events: auto; max-width: 560px; margin: 0 auto; background: var(--surface); border: 2px solid var(--accent); border-radius: var(--r);
  padding: 16px; display: grid; gap: 8px; box-shadow: 0 12px 40px rgb(0 0 0 / .28); }
.toast-t { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; }
#modal { position: fixed; inset: 0; z-index: 30; background: var(--scrim); display: grid; align-items: end; justify-items: center; overflow-y: auto;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
@media (min-width: 701px) { #modal { align-items: center; } }

  // ---------- daily checklist (times are minutes after waking) ----------
  function wakeMin() { const [h, m] = (state.profile.wake || "07:00").split(":").map(Number); return h * 60 + m; }
  function checklist(c) {
    const w = WEEK[new Date().getDay()];
    const wake = state.profile.wake || "07:00";
    const base = [
      { id: "wake", at: 0, t: "Wake up and drink a glass of water", d: "Then 5–10 minutes of daylight outside or at a window." },
      { id: "breakfast", at: 30, t: "Protein breakfast", d: "2 eggs, doi or dal, plus 1 roti or oats. Tea without sugar." },
      { id: "move", at: 180, t: "Get up and walk for 5 minutes", d: "Do this every hour you sit. Refill your water bottle." },
      { id: "lunch", at: 330, t: "Lunch: half the plate vegetables", d: `A palm of fish, chicken or dal, and one fist of rice. About ${Math.round(c.protein / 3)} g protein.` },
      { id: "walk", at: 360, t: "10–15 minute walk after lunch", d: "It lowers the blood sugar spike after eating." },
      { id: "snack", at: 540, t: "Smart snack, only if hungry", d: "Fruit, plain doi or roasted chana. No biscuits or fried snacks." },
      { id: "train", at: 630, t: `Workout: ${w.title}`, d: w.kind === "rest" ? "10 minutes of stretching. Rest counts." : "Open the Train tab and start today's session." },
      { id: "dinner", at: 750, t: "Dinner: plate method, lighter on rice", d: "Finish 3 hours before bed. Nothing to eat after this." },
      { id: "steps", at: 840, t: `Reach ${c.steps.toLocaleString()} steps`, d: "Short? A 15 minute walk now closes the gap. Ticks itself when you enter your steps." },
      { id: "water", at: 870, t: `Drink all ${c.glasses} glasses of water`, d: "Ticks itself when you fill the last glass." },
      { id: "drinks", at: 900, t: "No sugary drinks today", d: "No soft drinks, juice or sugar in tea." },
      { id: "winddown", at: 915, t: "Phone away, wind down", d: "Dim the lights, shower, stretch or read." },
      { id: "sleep", at: 960, t: "Lights out", d: "Aim for 7–8 hours. Same bedtime on weekends." }
    ];
    const wm = wakeMin();
    const mine = (state.custom || []).map(x => {
      const [h, m] = x.time.split(":").map(Number);
      return { id: "c-" + x.id, at: (h * 60 + m - wm + 1440) % 1440, t: x.t, d: "Your own task." };
    });
    return base.concat(mine).sort((a, b) => a.at - b.at).map(it => ({ ...it, time: shift(wake, it.at) }));
  }
  // minutes since today's wake-up time (negative between midnight and waking)
  function relNow() { const n = new Date(); return n.getHours() * 60 + n.getMinutes() - wakeMin(); }
  function statusOf(it, d, rel) {
    if (d.h && d.h[it.id]) return "done";
    if (rel < it.at) return "later";
    return rel < it.at + 60 ? "now" : "late";
  }
  function dayScore(k, ids) {
    const d = state.days[k];
    if (!d || !d.h || !ids.length) return 0;
    return ids.filter(id => d.h[id]).length / ids.length;
  }
  function streaks(c) {
    const ids = checklist(c).map(i => i.id);
    const ok = k => dayScore(k, ids) >= 0.7;
    let k = today(), cur = 0;
    if (!ok(k)) k = addDays(k, -1);
    while (ok(k) && k >= addDays(state.profile.startDate, -400)) { cur++; k = addDays(k, -1); }
    let best = 0, run = 0;
    for (let x = state.profile.startDate; x <= today(); x = addDays(x, 1)) { run = ok(x) ? run + 1 : 0; best = Math.max(best, run); }
    return { cur, best: Math.max(best, cur), ids };
  }

  // ---------- phone calendar file ----------
  function buildICS() {
    const items = checklist(calc()).filter(it => it.id !== "train");
    const wake = state.profile.wake || "07:00";
    const start = addDays(today(), 1);
    const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
    const icsEsc = s => String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
    const fold = line => { const out = []; for (let i = 0; i < line.length; i += 60) out.push((i ? " " : "") + line.slice(i, i + 60)); return out.join("\r\n"); };
    const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Body Reset Coach//EN", "CALSCALE:GREGORIAN", "X-WR-CALNAME:Body Reset Coach"];
    const ev = (id, dateKey, time, title, desc, rrule) => lines.push(
      "BEGIN:VEVENT", `UID:${id}@body-reset-coach`, `DTSTAMP:${stamp}`,
      `DTSTART:${dateKey.replace(/-/g, "")}T${time.replace(":", "")}00`, "DURATION:PT15M", `RRULE:${rrule}`,
      fold(`SUMMARY:${icsEsc(title)}`), fold(`DESCRIPTION:${icsEsc(desc)}`),
      "BEGIN:VALARM", "ACTION:DISPLAY", fold(`DESCRIPTION:${icsEsc(title)}`), "TRIGGER:PT0M", "END:VALARM", "END:VEVENT");
    // the step goal grows each phase, so the calendar title stays general
    items.forEach(it => ev(it.id, start, it.time, it.id === "steps" ? "Check your step goal" : it.t, it.d + " Tick it in Body Reset Coach.", "FREQ=DAILY"));
    const BYDAY = ["SU", "MO", "TU", "WE", "TH", "FR", "SA"];
    WEEK.forEach((w, i) => {
      let k = start; while (parseKey(k).getDay() !== i) k = addDays(k, 1);
      ev("train-" + BYDAY[i], k, shift(wake, 630), "Workout: " + w.title, w.desc + " Open the Train tab for the exercises.", "FREQ=WEEKLY;BYDAY=" + BYDAY[i]);
    });
    lines.push("END:VCALENDAR");
    return lines.join("\r\n") + "\r\n";
  }
  window.BodyReset = { ics: buildICS };

  function nextUpCard(H, d, rel) {

    const next = H.find(h => statusOf(h, d, rel) === "later");
    let head, body = "", act = "";
    if (now.length) {
      head = `Now: ${esc(now[0].t)}`;
      body = esc(now[0].d);
      act = `<button class="btn primary" data-done="${now[0].id}">I did it, tick it</button>`;
    } else if (next) {
      head = `Next at ${fmt12(next.time)}: ${esc(next.t)}`;
      body = `In ${inMinutes(next.at - rel)}. ${esc(next.d)}`;
    } else if (late.length) {
      head = "Day's almost done";
      body = "Tick anything below that you did today.";

      head = "All done today. Great work.";
      body = "Rest well. Tomorrow's checklist starts at your wake-up time.";

    return {

      score: avg(ks.map(k => dayScore(k, ids))), wo: state.workouts.filter(x => ks.includes(x.d)).length
    };
  }
  function coachSays(c, a, b) {
    const out = [];
    const dw = a.w !== null && b.w !== null ? a.w - b.w : null;
    if (dw !== null && dw <= -1.2) out.push("You're losing fast. Add about 150 kcal a day (an egg and a fruit) so you keep your muscle.");
    else if (dw !== null && dw < -0.1) out.push(`Down ${r1(-dw)} kg on the weekly average. Right on track. Keep everything the same.`);
    else if (dw !== null) out.push("Your weight held steady this week. Common causes: extra rice or oil, weekend eating, or water from salt. Log every meal for 7 days and add 1,000 steps a day.");
    if (a.score !== null && a.score < 0.5) out.push("Your checklist was under half done. Pick just 3 tasks to never miss: protein breakfast, walk after lunch, no sugary drinks.");
    if (a.wo < 3) out.push("Fewer than 3 workouts this week. Put your workout time in your calendar like a meeting.");
    if (a.sleep !== null && a.sleep < 6.5) out.push(`You slept about ${r1(a.sleep)} hours a night. Move bedtime 15 minutes earlier each week.`);
    if (a.kcal !== null && a.kcal > c.target + 150) out.push(`On days you logged, you averaged ${kc(a.kcal)} kcal, above your ${kc(c.target)} target. Look at oil, rice and snacks first.`);
    if (!out.length) out.push("Log your weight, food and workouts for a week to get a full report.");
    return out;
  }

  // ---------- modal sheets: craving SOS and breathing ----------
  const modal = document.getElementById("modal");
  let modalTimer = null, sosEnd = 0, breathStart = 0;
  function closeModal() { clearInterval(modalTimer); modalTimer = null; modal.hidden = true; modal.innerHTML = ""; }
  function openSOS() {
    sosEnd = 0;
    modal.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sos-h">
      <div class="sheet-head"><h2 id="sos-h">Craving SOS</h2><button class="btn small" data-close="1">Close</button></div>
      <p class="small">Cravings rise and fall like a wave, usually within 10–15 minutes. Ride it out:</p>
      <ol class="plain small">
        <li><b>Hunger check:</b> would you eat a boiled egg or an apple right now? If yes, you're hungry: eat one. If no, it's a craving.</li>
        <li>Drink a full glass of water.</li>
        <li>Start the 10 minute timer and do something else: walk, shower, call someone, brush your teeth.</li>
        <li>Still want it after 10 minutes? Have a small portion, slowly, sitting down, and enjoy it. Then move on.</li>
      </ol>
      <div class="bigtime" id="sos-time">10:00</div>
      <button class="btn primary wide" id="sos-start">Start 10 minute timer</button>
    </div>`;
    modal.hidden = false;
  }
  function openBreathe() {
    breathStart = Date.now();
    modal.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="br-h">
      <div class="sheet-head"><h2 id="br-h">Calm breathing</h2><button class="btn small" data-close="1">Close</button></div>
      <div class="breath" aria-hidden="true"></div>
      <p class="breath-cue" id="br-cue">Breathe in</p>
      <p class="bigtime" id="br-time" style="font-size:1.6rem">2:00</p>
      <p class="small muted" style="text-align:center">In through your nose for 4, out slowly through your mouth for 6. Follow the circle.</p>
    </div>`;
    modal.hidden = false;
    clearInterval(modalTimer);
    modalTimer = setInterval(() => {
      const t = (Date.now() - breathStart) / 1000, left = Math.max(0, 120 - Math.floor(t));
      const cue = document.getElementById("br-cue"), tm = document.getElementById("br-time");
      if (!cue) return closeModal();
      cue.textContent = left === 0 ? "Well done" : (t % 10) < 4 ? "Breathe in" : "Breathe out";
      tm.textContent = `${Math.floor(left / 60)}:${pad(left % 60)}`;
      if (left === 0) { clearInterval(modalTimer); chime(); }
    }, 250);
  }
  modal.addEventListener("click", e => {
    if (e.target === modal || e.target.closest("[data-close]")) return closeModal();
    if (e.target.closest("#sos-start")) {
      unlockAudio();
      sosEnd = Date.now() + 10 * 60 * 1000;
      e.target.closest("#sos-start").textContent = "Timer running. Go do something else.";
      clearInterval(modalTimer);
      modalTimer = setInterval(() => {
        const el = document.getElementById("sos-time"); if (!el) return closeModal();
        const left = Math.max(0, Math.ceil((sosEnd - Date.now()) / 1000));
        el.textContent = `${Math.floor(left / 60)}:${pad(left % 60)}`;
        if (!left) { clearInterval(modalTimer); el.textContent = "Done!"; chime(); }
      }, 250);
    }
  });

  // ---------- rest timer for guided workouts ----------
  let restEnd = 0, restTimer = null;
  function startRest(sec) { restEnd = Date.now() + sec * 1000; clearInterval(restTimer); restTimer = setInterval(updRest, 250); updRest(); }
  function updRest() {
    const bar = document.getElementById("restbar");
    const left = Math.max(0, Math.ceil((restEnd - Date.now()) / 1000));
    if (bar) {
      bar.hidden = !restEnd;
      document.getElementById("rest-label").textContent = left ? "Rest" : "Go! Next set";
      document.getElementById("rest-time").textContent = `${Math.floor(left / 60)}:${pad(left % 60)}`;
    }
    if (!left && restTimer) { clearInterval(restTimer); restTimer = null; chime(); setTimeout(() => { restEnd = 0; updRest(); }, 4000); }
  }

  // ---------- render ----------
  const app = document.getElementById("app");
  function render() {
    const c = calc();
    const ready = state.profile.confirmed;
    document.getElementById("tabs").hidden = !ready;
    document.getElementById("daychip").textContent = ready ? `Day ${c.dayNo} · ${r1(c.current)} kg` : "";
    if (!ready) { app.innerHTML = `<section class="view">${viewWelcome()}</section>`; return; }
    document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
    const v = { today: viewToday, coach: viewCoach, train: viewTrain, food: viewFood, progress: viewProgress, health: viewHealth, me: viewMe }[tab] || viewToday;
    app.innerHTML = `<section class="view" role="tabpanel" aria-labelledby="tab-${tab}">${v(c)}</section>`;
    if (restEnd) updRest();
  }

  // ---------- events ----------
  document.getElementById("tabs").addEventListener("click", e => {
    const b = e.target.closest("button[data-tab]"); if (!b) return;
    tab = b.dataset.tab; resetArmed = false;
    try { localStorage.setItem(LS_KEY + ":tab", tab); } catch (err) {}
    render(); window.scrollTo({ top: 0 });
  });

  app.addEventListener("keydown", e => {
    if (e.target.id === "chat-in" && e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendChat(e.target.value); }
  });

  app.addEventListener("input", e => {
    if (e.target.id === "f-q") { foodQuery = e.target.value; const r = document.getElementById("f-res"); if (r) r.innerHTML = foodResults(); }
  });

  app.addEventListener("change", e => {
    const t = e.target, d = day(today()), p = state.profile;
    if (t.dataset.habit) { d.h = d.h || {}; d.h[t.dataset.habit] = t.checked; return save(); }
    if (t.dataset.lab) { state.labs[t.dataset.lab] = t.checked; return save(); }
    if (t.dataset.sb) { state.sleep = state.sleep || {}; state.sleep[t.dataset.sb] = t.checked; return save(); }
    if (t.dataset.groc) { const g = state.grocery.find(x => x.id === t.dataset.groc); if (g) g.done = t.checked; return save(); }
    switch (t.id) {
      case "in-steps": { const n = num(t.value); if (n === null) delete d.steps; else d.steps = Math.max(0, Math.round(n)); if (n !== null && n >= calc().steps) { d.h = d.h || {}; d.h.steps = true; } return save(); }
      case "in-weight": { const n = num(t.value); if (n === null) delete d.weight; else if (n >= 30 && n <= 300) d.weight = r1(n); return save(); }
      case "in-waist": { const n = num(t.value); if (n === null) delete d.waist; else d.waist = r1(n); return save(); }
      case "in-sleep": { const n = num(t.value); if (n === null) delete d.sleep; else if (n >= 0 && n <= 16) d.sleep = n; return save(); }
      case "p-name": p.name = t.value.trim(); return save();
      case "p-age": { const n = num(t.value); if (n && n >= 14 && n <= 90) p.age = Math.round(n); return save(); }
      case "p-sex": p.sex = t.value; return save();
      case "p-ft": case "p-in": {
        const ft = num(document.getElementById("p-ft").value) || 0, inch = num(document.getElementById("p-in").value) || 0;
        const cm = (ft * 12 + inch) * 2.54; if (cm > 120 && cm < 230) p.heightCm = r1(cm); return save();
      }
      case "p-sw": { const n = num(t.value); if (n && n >= 30 && n <= 300) p.startWeight = r1(n); return save(); }
      case "p-act": p.activity = Number(t.value); return save();
      case "p-wake": if (t.value) p.wake = t.value; return save();
      case "p-start": if (t.value) p.startDate = t.value; return save();
      case "ph-pose": phPose = t.value; cmpA = cmpB = null; return render();
      case "cmp-a": cmpA = t.value; return render();
      case "cmp-b": cmpB = t.value; return render();
      case "ph-file": if (t.files && t.files[0]) addPhoto(t.files[0]); return;
    }
  });

  app.addEventListener("click", e => {
    const t = e.target.closest("button"); if (!t) return;
    const tk = today(), d = day(tk), p = state.profile;
    const tickTrain = () => { d.h = d.h || {}; d.h.train = true; };
    if (t.dataset.sub) { const [k, v] = t.dataset.sub.split(":"); sub[k] = v; return render(); }
    if (t.dataset.water) {
      const n = Number(t.dataset.water); d.water = d.water === n ? n - 1 : n;
      if (d.water >= calc().glasses) { d.h = d.h || {}; d.h.water = true; }
      return save();
    }
    if (t.dataset.mood) { d.mood = Number(t.dataset.mood); return save(); }
    if (t.dataset.energy) { d.energy = Number(t.dataset.energy); return save(); }
    if (t.dataset.delw) { delete state.days[t.dataset.delw].weight; return save(); }
    if (t.dataset.done) { d.h = d.h || {}; d.h[t.dataset.done] = true; return save(); }
    // food
    if (t.dataset.meal) { foodMeal = t.dataset.meal; return render(); }
    if (t.dataset.planday) { planDay = Number(t.dataset.planday); return render(); }
    if (t.dataset.logmeal) {
      const m = t.dataset.logmeal; d.food = d.food || [];
      PLAN[planDay][m].forEach(([n, q]) => { const f = foodByName(n); d.food.push({ id: uid(), meal: m, n: f.n, u: f.u, kcal: f.kcal, p: f.p, qty: q }); });
      return save();
    }
    if (t.dataset.phpose) { phPose = t.dataset.phpose; cmpA = cmpB = null; return render(); }
    if (t.dataset.delph) {
      if (delPhoto !== t.dataset.delph) { delPhoto = t.dataset.delph; return render(); }
      return removePhoto(t.dataset.delph);
    }
    if (t.dataset.addfood) {
      const f = (state.myFoods || []).concat(FOODS).find(x => x.id === t.dataset.addfood); if (!f) return;
      d.food = d.food || [];
      d.food.push({ id: uid(), meal: foodMeal, n: f.n, u: f.u, kcal: f.kcal, p: f.p, qty: 1 });
      return save();
    }
    if (t.dataset.fq) {
      const [id, delta] = t.dataset.fq.split(":"); const e2 = (d.food || []).find(x => x.id === id); if (!e2) return;
      e2.qty = Math.round((e2.qty + Number(delta)) * 10) / 10;
      if (e2.qty <= 0) d.food = d.food.filter(x => x.id !== id);
      return save();
    }
    // workouts
    if (t.dataset.startwo) { unlockAudio(); state.session = { kind: t.dataset.startwo, start: Date.now(), startHM: nowHM(), done: {} }; sub.train = "today"; return save(); }
    if (t.dataset.set) {
      unlockAudio();
      const [i, n] = t.dataset.set.split(":").map(Number), s = state.session; if (!s) return;
      s.done[i] = (s.done[i] || 0) === n ? n - 1 : n;
      if (s.done[i] === n) startRest(PHASES[calc().phase - 1].rest);
      return save();
    }
    if (t.dataset.delwo) { state.workouts = state.workouts.filter(x => x.id !== t.dataset.delwo); return save(); }
    if (t.dataset.rtype) { readType = t.dataset.rtype; return render(); }
    if (t.dataset.delrd) { state.readings = state.readings.filter(x => x.id !== t.dataset.delrd); return save(); }
    if (t.dataset.delc) { state.custom = state.custom.filter(x => x.id !== t.dataset.delc); return save(); }
    if (t.dataset.ask) {
      if (aiMode() === "none") { tab = "coach"; render(); return window.scrollTo({ top: 0 }); }
      return sendChat(t.dataset.ask);
    }
    if (t.dataset.delnote) { state.notes = state.notes.filter(n => n.id !== t.dataset.delnote); return save(); }
    switch (t.id) {
      case "chat-send": { const box = document.getElementById("chat-in"); return sendChat(box.value); }
      case "chat-stop": if (chatCtl) chatCtl.abort(); return;
      case "chat-clear": state.chat = []; chatErr = ""; return save();
      case "note-add": { const v = document.getElementById("note-new").value.trim(); if (v) { state.notes.push({ id: uid(), t: v }); return save(); } return; }
      case "ai-save": {
        const k = document.getElementById("ai-key").value.trim();
        if (!/^sk-ant-[\w-]{20,}$/.test(k)) { keyMsg = "That doesn't look like an Anthropic API key. It starts with sk-ant-."; return render(); }
        try { localStorage.setItem(KEY_LS, k); keyMsg = "Key saved on this phone. Say hello to your coach!"; } catch (err) { keyMsg = "This browser couldn't save the key. In Safari, turn off Private Browsing."; }
        return render();
      }
      case "ai-remove": try { localStorage.removeItem(KEY_LS); } catch (err) {} keyMsg = "Key removed from this phone."; return render();
      case "open-sos": return openSOS();
      case "open-breathe": return openBreathe();
      case "rest-skip": restEnd = Date.now(); return updRest();
      case "wo-finish": {
        const s = state.session; if (!s) return;
        const ph = PHASES[calc().phase - 1];
        const sets = Object.values(s.done).reduce((a, b) => a + b, 0);
        state.workouts.push({ id: uid(), d: tk, at: nowHM(), kind: s.kind, mins: Math.max(1, Math.round((Date.now() - s.start) / 60000)), sets, of: EX[s.kind].length * ph.setsN });
        state.session = null; restEnd = 0; clearInterval(restTimer); tickTrain(); return save();
      }
      case "wo-cancel": state.session = null; restEnd = 0; clearInterval(restTimer); return save();
      case "wo-stretch": state.workouts.push({ id: uid(), d: tk, at: nowHM(), kind: "stretch", mins: 10 }); tickTrain(); return save();
      case "wk-log": {
        const m = num(document.getElementById("wk-min").value); if (!m || m < 1) return;
        state.workouts.push({ id: uid(), d: tk, at: nowHM(), kind: document.getElementById("wk-kind").value, mins: Math.round(m) });
        if (WEEK[new Date().getDay()].kind === "walk") tickTrain();
        return save();
      }
      case "f-add": {
        const name = document.getElementById("f-name").value.trim(), k = num(document.getElementById("f-kcal").value), pr = num(document.getElementById("f-p").value) || 0;
        const msg = document.getElementById("f-msg");
        if (!name || k === null) { msg.textContent = "Enter a name and the calories."; return; }
        const f = { id: "my" + uid(), n: name, u: "1 portion", kcal: Math.round(k), p: r1(pr) };
        if (document.getElementById("f-save").checked) state.myFoods.push(f);
        d.food = d.food || []; d.food.push({ id: uid(), meal: foodMeal, n: f.n, u: f.u, kcal: f.kcal, p: f.p, qty: 1 });
        return save();
      }
      case "f-copy": {
        const y = (state.days[addDays(tk, -1)] || {}).food || [];
        d.food = y.map(x => ({ ...x, id: uid() })); return save();
      }
      case "g-add": { const v = document.getElementById("g-new").value.trim(); if (v) { state.grocery.push({ id: "g" + uid(), t: v, done: false }); return save(); } return; }
      case "m-save": {
        const dd = day(tk); dd.m = dd.m || {};
        let n = 0;
        MEAS.forEach(([f]) => {
          const v = num(document.getElementById("m-" + f).value), ok = v !== null && v >= 20 && v <= 250;
          if (f === "waist") { if (ok) { dd.waist = r1(v); n++; } else delete dd.waist; }
          else if (ok) { dd.m[f] = r1(v); n++; } else delete dd.m[f];
        });
        save();
        const msg = document.getElementById("m-msg");
        if (msg) msg.textContent = n ? `Saved ${n} ${n === 1 ? "measurement" : "measurements"}.` : "Enter at least one measurement.";
        return;
      }
      case "plan-shop": {
        const keys = new Set();
        PLAN.forEach(P => MEALS.forEach(([m]) => P[m].forEach(([n]) => { if (SHOP_FOR[n]) keys.add(SHOP_FOR[n]); })));
        let added = 0, unticked = 0;
        keys.forEach(k => {
          const have = state.grocery.find(g => g.t.toLowerCase().includes(k));
          if (have) { if (have.done) { have.done = false; unticked++; } }
          else { state.grocery.push({ id: "g" + uid(), t: SHOP_ITEM[k], done: false }); added++; }
        });
        save();
        const msg = document.getElementById("plan-msg");
        if (msg) msg.textContent = `Added ${added} new ${added === 1 ? "item" : "items"}${unticked ? ` and unticked ${unticked}` : ""}. Open Shop to see the list.`;
        return;
      }
      case "g-clear": state.grocery.forEach(x => { x.done = false; }); return save();
      case "g-remove": state.grocery = state.grocery.filter(x => !x.done); return save();
      case "rd-add": {
        const msg = document.getElementById("rd-msg");
        if (readType === "bp") {
          const s = num(document.getElementById("bp-s").value), di = num(document.getElementById("bp-d").value), pu = num(document.getElementById("bp-p").value);
          if (!s || !di || s < 60 || s > 260 || di < 30 || di > 160) { msg.textContent = "Enter both numbers, for example 128 and 84."; return; }
          state.readings.push({ id: uid(), d: tk, time: nowHM(), type: "bp", sys: Math.round(s), dia: Math.round(di), pulse: pu ? Math.round(pu) : null });
        } else {
          const v = num(document.getElementById("sg-v").value), unit = document.getElementById("sg-u").value;
          if (!v) { msg.textContent = "Enter your reading."; return; }
          const mg = unit === "mmol" ? v * 18 : v;
          if (mg < 20 || mg > 600) { msg.textContent = unit === "mmol" ? "That looks off. mmol/L readings are usually between 3 and 20." : "That looks off. mg/dL readings are usually between 60 and 400."; return; }
          state.readings.push({ id: uid(), d: tk, time: nowHM(), type: "sugar", mg, unit, when: document.getElementById("sg-w").value });
        }
        return save();
      }
      case "c-add": {
        const time = document.getElementById("c-time").value, text = document.getElementById("c-text").value.trim();
        if (time && text) { state.custom.push({ id: uid(), time, t: text }); return save(); }
        return;
      }
      case "r-toggle": {
        const on = !(state.reminders && state.reminders.on);
        state.reminders = { on };
        if (on) {
          unlockAudio(); chime();
          try { if ("Notification" in window && Notification.permission === "default") Notification.requestPermission().catch(() => {}); } catch (err) {}
        }
        return save();
      }
      case "r-cal": {
        const msg = document.getElementById("r-msg");
        if (window.claude && typeof window.claude.use === "function") {
          msg.textContent = "Calendar files can't be saved from inside Claude. Open the app at fmsami.github.io/health-coach and press this button there.";
          return;
        }
        try {
          const url = URL.createObjectURL(new Blob([buildICS()], { type: "text/calendar" }));
          const a = document.createElement("a"); a.href = url; a.download = "body-reset-reminders.ics";
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 5000);
          msg.textContent = /iPhone|iPad/.test(navigator.userAgent)
            ? "If your calendar didn't open, go to Files → Downloads and tap body-reset-reminders.ics, then Add All."
            : "Saved body-reset-reminders.ics. Open it to add the daily reminders to your calendar. For Google Calendar: calendar.google.com → Settings → Import.";
        } catch (err) { msg.textContent = "This browser couldn't save the file. Try Safari, Chrome or Edge."; }
        return;
      }
      case "w-start": {
        const val = id => document.getElementById(id).value;
        const age = num(val("w-age")), kg = num(val("w-kg"));
        const cm = ((num(val("w-ft")) || 0) * 12 + (num(val("w-in")) || 0)) * 2.54;
        const msg = document.getElementById("w-msg");
        if (!age || age < 14 || age > 90) { msg.textContent = "Enter an age between 14 and 90."; return; }
        if (cm < 120 || cm > 230) { msg.textContent = "Enter your height in feet and inches, for example 5 and 9."; return; }
        if (!kg || kg < 30 || kg > 300) { msg.textContent = "Enter your weight in kg, for example 85."; return; }
        Object.assign(p, { name: val("w-name").trim(), age: Math.round(age), sex: val("w-sex"), heightCm: r1(cm), startWeight: r1(kg), activity: Number(val("w-act")), wake: val("w-wake") || "07:00", confirmed: true });
        if (!weights().length) { p.startDate = tk; day(tk).weight = r1(kg); }
        tab = "today";
        return save();
      }
      case "add-btn": {
        const k = document.getElementById("add-date").value, w = num(document.getElementById("add-w").value);
        if (k && w && w >= 30 && w <= 300) { day(k).weight = r1(w); if (k < p.startDate) p.startDate = k; save(); }
        return;
      }
      case "b-copy": {
        const msg = document.getElementById("b-msg"), txt = JSON.stringify(state);
        const fallback = () => { const ta = document.getElementById("b-text"); ta.value = txt; ta.select(); msg.textContent = "Selected in the box below. Copy it with Ctrl+C or long-press."; };
        try { navigator.clipboard.writeText(txt).then(() => { msg.textContent = "Backup copied. Paste it into Notes or a message to yourself."; }, fallback); } catch (err) { fallback(); }
        return;
      }
      case "b-restore": {
        const m = document.getElementById("b-msg");
        try {
          const s = JSON.parse(document.getElementById("b-text").value);
          if (!s || !s.profile || !s.days) throw new Error();
          state = ensure(s); save();
        } catch (err) { if (m) m.textContent = "That doesn't look like a backup from this app. Copy the whole text and try again."; }
        return;
      }
      case "b-reset": {
        if (!resetArmed) { resetArmed = true; return render(); }
        resetArmed = false; state = defaultState(); tab = "today"; return save();
      }
    }
  });

  // ---------- reminders while the app is open ----------
  const toast = document.getElementById("toast");
  const baseTitle = document.title;
  const snoozed = {};
  let audio = null, lastRel = null;
  function unlockAudio() {
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === "suspended") audio.resume(); } catch (e) {}
  }
  function chime() {
    if (!audio) return;
    try {
      const t0 = audio.currentTime;
      [660, 880, 990].forEach((f, i) => {
        const o = audio.createOscillator(), g = audio.createGain(), at = t0 + i * 0.18;
        o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, at);
        g.gain.exponentialRampToValueAtTime(0.25, at + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, at + 0.3);
        o.connect(g).connect(audio.destination); o.start(at); o.stop(at + 0.32);
      });
    } catch (e) {}
  }
  function remind(it) {
    toast.innerHTML = `<div class="toast-card" role="alert">
      <p class="label">Reminder · ${fmt12(it.time)}</p>
      <p class="toast-t">${esc(it.t)}</p>
      <p class="small muted">${esc(it.d)}</p>
      <div class="row"><button class="btn primary" data-tdone="${it.id}">Done, tick it</button><button class="btn" data-snooze="${it.id}">Remind me in 15 min</button><button class="btn" data-close="1">Dismiss</button></div>
    </div>`;
    toast.hidden = false;
    document.title = "(!) " + baseTitle;
    chime();
    try { if ("Notification" in window && Notification.permission === "granted") new Notification("Body Reset Coach", { body: it.t }); } catch (e) {}
  }
  function hideToast() { toast.hidden = true; toast.innerHTML = ""; document.title = baseTitle; }
  toast.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.tdone) { const d = day(today()); d.h = d.h || {}; d.h[b.dataset.tdone] = true; hideToast(); return save(); }
    if (b.dataset.snooze) snoozed[b.dataset.snooze] = Date.now() + 15 * 60 * 1000;
    hideToast();
  });
  // browsers only play sound after a tap, so unlock it on the first one
  document.addEventListener("pointerdown", () => { if (state.reminders && state.reminders.on) unlockAudio(); });

  function tick() {
    const rel = relNow();
    if (state.profile.confirmed && state.reminders && state.reminders.on && lastRel !== null && rel !== lastRel) {
      const d = day(today()), H = checklist(calc());
      const crossed = at => lastRel < rel ? (at > lastRel && at <= rel) : (at > lastRel || at <= rel);
      const due = H.filter(it => !(d.h && d.h[it.id]) && crossed(it.at));
      Object.keys(snoozed).forEach(id => {
        if (Date.now() < snoozed[id]) return;
        delete snoozed[id];
        const it = H.find(x => x.id === id);
        if (it && !(d.h && d.h[id]) && !due.includes(it)) due.push(it);
      });
      if (due.length) remind(due[due.length - 1]);
    }
    const changed = rel !== lastRel;
    lastRel = rel;
    if (changed && tab === "today" && modal.hidden && !app.contains(document.activeElement)) render();
  }

  render();
  initSync();
  initPhotos();
  initAI();
  tick();
  setInterval(tick, 20 * 1000);
  // offline support when installed from the website (not inside Claude)
  if ("serviceWorker" in navigator && /(^|\.)github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname)) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
